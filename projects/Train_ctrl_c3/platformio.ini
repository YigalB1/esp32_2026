; PlatformIO Project Configuration File — train_ctrl_c3
; Board: ESP32-C3 SuperMini (generic clone board)
; NOTE: if upload/monitor via native USB acts up, this is the usual ESP32-C3
; SuperMini gotcha — the board def / USB CDC flag below is the common fix.

[env:esp32-c3-supermini]
platform = espressif32
board = lolin_c3_mini      ; closest stock board def for the ESP32-C3 SuperMini clones
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; needed for Serial over native USB on most C3 SuperMini boards

lib_deps =
    https://github.com/adafruit/Adafruit_AW9523.git
    adafruit/Adafruit BusIO @ ^1.16.1   ; required dependency of the AW9523 lib
    ; esp_now and WiFi come from the arduino-esp32 core, no lib_dep needed
    ; VL53L0X lib intentionally omitted for this revision — add when distance
    ; sensing work starts (e.g. pololu/VL53L0X)
